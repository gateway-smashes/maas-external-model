# LlamaStackDistribution — the Gen AI playground backend for this project.
#
# maas-ui calls GET /api/v1/lsd/models?namespace=<ns>. With no LSD in that
# namespace it logs:
#   level=ERROR msg="no LlamaStackDistribution found in namespace \"<ns>\""
# and the playground shows no models. Creating this object is normally done by
# clicking "Add to playground" in the dashboard; this manifest does it declaratively.
#
# spec.server.distribution takes EITHER name: <known-distribution> OR image: <ref>.
# Valid values are cluster-specific, so scripts/15-playground.sh resolves them at
# run time and fills LSD_DIST_KEY / LSD_DIST_VALUE. Do not hardcode them here.
#
# Applied by scripts/15-playground.sh (envsubst).
apiVersion: llamastack.io/v1alpha1
kind: LlamaStackDistribution
metadata:
  name: ${LSD_NAME}
  namespace: ${MAAS_NS}
  labels:
    opendatahub.io/dashboard: "true"
    app.kubernetes.io/part-of: genai-playground
spec:
  replicas: 1
  server:
    distribution:
      ${LSD_DIST_KEY}: ${LSD_DIST_VALUE}
    containerSpec:
      port: 8321
      env:
        # Point LlamaStack at the shim, not directly at the gateway.
        # remote::vllm discovers models via {VLLM_URL}/models, which MaaS does
        # not serve under the per-model prefix (404). The shim answers that one
        # path and forwards everything else to the working prefix.
        # See playground/model-shim.yaml.
        - name: VLLM_URL
          value: "http://lsd-model-shim.${MAAS_NS}.svc:8080/v1"
        # Real MaaS API key. The stock LSD ships VLLM_API_TOKEN_1=fake, which
        # makes every playground call fail with no visible error.
        - name: VLLM_API_TOKEN_1
          valueFrom:
            secretKeyRef:
              name: lsd-maas-api-key
              key: api-key
        - name: VLLM_TLS_VERIFY
          value: "false"
        # Must stay BELOW the model context window or responses come back empty
        # with ContextWindowExceeded and no error in the UI.
        - name: VLLM_MAX_TOKENS
          value: "${PLAYGROUND_MAX_TOKENS}"
        - name: LLAMA_STACK_CONFIG_DIR
          value: "/opt/app-root/src/.llama/distributions/rh/"
        - name: MILVUS_DB_PATH
          value: "~/.llama/milvus.db"
        - name: FMS_ORCHESTRATOR_URL
          value: "http://localhost"
        - name: PLAYGROUND_MODEL_ID
          value: "${MODEL_NAME}"
        - name: PLAYGROUND_PROVIDER_ID
          value: "${PLAYGROUND_PROVIDER_ID}"
        # The RH distribution image defines BOTH storage backends as Postgres
        # (kv_postgres + sql_postgres) with no sqlite fallback. Without these
        # the pod crashloops on "Could not connect to PostgreSQL database
        # server". See playground/postgres.yaml.
        - name: POSTGRES_HOST
          value: "lsd-postgres"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: lsd-postgres
              key: password
