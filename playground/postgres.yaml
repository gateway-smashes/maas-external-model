# Postgres for the Gen AI playground's LlamaStackDistribution.
#
# The RHOAI llama-stack distribution image (odh-llama-stack-core-rhel9) defines
# BOTH storage backends as Postgres:
#   storage.backends.kv_default  -> kv_postgres   host ${env.POSTGRES_HOST:=localhost}
#   storage.backends.sql_default -> sql_postgres  host ${env.POSTGRES_HOST:=localhost}
# There is no sqlite provider to switch to, so without a database the pod
# crashloops on:
#   RuntimeError: Could not connect to PostgreSQL database server
#
# This is NOT maas-postgres in redhat-ods-applications — that is MaaS's own
# database and must not be shared with LlamaStack.
#
# Storage is emptyDir: the playground's registry is rebuilt on start, so losing
# it on restart is harmless. Swap in a PVC if you want it to persist.
#
# Create the Secret first (see scripts/15-playground.sh or the README), then:
#   oc apply -f playground/postgres.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lsd-postgres
  namespace: ${MAAS_NS}
  labels:
    app.kubernetes.io/name: lsd-postgres
    app.kubernetes.io/part-of: genai-playground
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: lsd-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lsd-postgres
        app.kubernetes.io/part-of: genai-playground
    spec:
      containers:
        - name: postgresql
          image: registry.redhat.io/rhel9/postgresql-16:latest
          ports:
            - containerPort: 5432
              name: postgresql
          env:
            - name: POSTGRESQL_USER
              valueFrom:
                secretKeyRef: { name: lsd-postgres, key: user }
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef: { name: lsd-postgres, key: password }
            - name: POSTGRESQL_DATABASE
              valueFrom:
                secretKeyRef: { name: lsd-postgres, key: database }
          volumeMounts:
            - name: data
              mountPath: /var/lib/pgsql/data
          readinessProbe:
            exec:
              command: ["/usr/libexec/check-container"]
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: "1",  memory: 1Gi }
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: lsd-postgres
  namespace: ${MAAS_NS}
  labels:
    app.kubernetes.io/name: lsd-postgres
spec:
  selector:
    app.kubernetes.io/name: lsd-postgres
  ports:
    - name: postgresql
      port: 5432
      targetPort: 5432
