# RHOAI Tenant reconciler stamps EnvoyFilter/payload-processing with anchor:
#   extensions.istio.io/wasmplugin/<gateway-ns>.kuadrant-<gateway>
# but Kuadrant often injects auth as envoy.filters.http.wasm (no WasmPlugin CR).
# INSERT_BEFORE router keeps auth wasm ahead of IPP path rewrite.
#
# Render + apply via:
#   ./scripts/05-gateway.sh ipp
# or:
#   . ./config.env && envsubst < cluster/ipp-envoyfilter-fix.yaml | oc apply -f -
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: payload-processing-attach-fix
  namespace: ${GATEWAY_NS}
  labels:
    app.kubernetes.io/name: payload-processing-fix
    app.kubernetes.io/part-of: models-as-a-service
  annotations:
    opendatahub.io/managed: "false"
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: ${GATEWAY_NAME}
  configPatches:
    - applyTo: HTTP_FILTER
      match:
        context: GATEWAY
        listener:
          filterChain:
            filter:
              name: envoy.filters.network.http_connection_manager
              subFilter:
                name: envoy.filters.http.router
      patch:
        operation: INSERT_BEFORE
        value:
          name: envoy.filters.http.ext_proc.bbr
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
            allow_mode_override: true
            failure_mode_allow: false
            grpc_service:
              envoy_grpc:
                cluster_name: outbound|9004||payload-processing.${IPP_NS}.svc.cluster.local
            processing_mode:
              request_body_mode: FULL_DUPLEX_STREAMED
              request_header_mode: SEND
              request_trailer_mode: SEND
              response_body_mode: FULL_DUPLEX_STREAMED
              response_header_mode: SEND
              response_trailer_mode: SEND
