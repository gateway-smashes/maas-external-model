# Reference only — scripts/05-gateway.sh renders the Route via heredoc so
# ROUTE_LABELS keys with '/' (e.g. ingress.k8s.bb/class) are safely quoted.
#
# Expected shape after install:
#   Route/${GATEWAY_NAME} in ${GATEWAY_NS}
#   spec.host = ${GATEWAY_HOSTNAME}   # e.g. maas.<CUSTOM_DOMAIN>
#   metadata.labels includes ROUTE_LABELS from config.env
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: maas-default-gateway
  namespace: maas-gateway
  labels:
    app.kubernetes.io/name: maas-gateway
    # "ingress.k8s.bb/class": "nginx"
  annotations:
    opendatahub.io/managed: "false"
spec:
  host: maas.example.com
  to:
    kind: Service
    name: maas-default-gateway-openshift-default
    weight: 100
  port:
    targetPort: https
  tls:
    termination: passthrough
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
