# ===========================================================================
# EXTERNAL MODEL -- native MaaS path (Technology Preview in RHOAI 3.4)
#
# !!! VERIFY BEFORE APPLYING !!!
# External-model support is Tech Preview and its field names are not fully
# documented publicly. Run ./scripts/00-discover.sh and compare section B
# (`oc explain llminferenceservice.spec --recursive`) against the block
# marked "VERIFY" below. If the fields differ, fix them here -- everything
# else in this file (labels, annotations, gateway wiring) is standard.
#
# If the CRD on your cluster has no external/passthrough fields at all, your
# build does not expose this yet: use the litellm-fallback/ manifests instead.
# ===========================================================================
apiVersion: serving.kserve.io/v1alpha1
kind: LLMInferenceService
metadata:
  name: ${MODEL_NAME}
  namespace: ${MAAS_NS}
  labels:
    opendatahub.io/dashboard: "true"
    # Marks the model as a MaaS-published asset (shows in Gen AI studio).
    opendatahub.io/maas: "true"
  annotations:
    openshift.io/display-name: "${MODEL_DISPLAY_NAME}"
    openshift.io/description: "${MODEL_DESCRIPTION}"
    # Tells the dashboard this is externally hosted, not a local vLLM pod.
    opendatahub.io/model-type: "external"
spec:
  # ---- VERIFY: external provider wiring ---------------------------------
  model:
    name: ${PROVIDER_MODEL_ID}          # id the PROVIDER expects
    uri: ${PROVIDER_BASE_URL}           # e.g. https://llm.example.com/v1
  external:
    endpoint:
      url: ${PROVIDER_BASE_URL}
    auth:
      apiKeySecretRef:
        name: ${MODEL_NAME}-provider
        key: api_key
      headerName: Authorization
      headerPrefix: "Bearer "
  # -----------------------------------------------------------------------

  # No local pods for an external model.
  replicas: 0

  # Publish through the same gateway the dashboard uses.
  router:
    gateway:
      refs:
        - name: ${GATEWAY_NAME}
          namespace: ${GATEWAY_NS}
    route: {}
    scheduler: {}
