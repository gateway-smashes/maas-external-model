# Grants a MaaS tier permission to call this model. Applied once per tier by
# 10-apply.sh (__TIER__ is substituted). The 'post' verb is what MaaS checks
# for POST /v1/chat/completions -- omitting it yields 403 at inference time.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: llminferenceservice-access-${MODEL_NAME}-__TIER__
  namespace: ${MAAS_NS}
rules:
  - apiGroups: ["serving.kserve.io"]
    resources: ["llminferenceservices"]
    resourceNames: ["${MODEL_NAME}"]
    verbs: ["get", "list", "post"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: llminferenceservice-access-${MODEL_NAME}-__TIER__
  namespace: ${MAAS_NS}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: llminferenceservice-access-${MODEL_NAME}-__TIER__
subjects:
  # MaaS creates one ServiceAccount namespace per tier:
  #   maas-<gatewayconfig-name>-tier-<tier>
  - kind: ServiceAccount
    name: default
    namespace: maas-default-gateway-tier-__TIER__
